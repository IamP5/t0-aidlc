[project]
name = "t0-toolkit"
version = "0.1.0"
description = "AIDLC t0 toolkit: OKF knowledge base, methodology gates, rituals and agent adapters"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
t0 = "t0.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t0"]

[tool.hatch.build.targets.wheel.force-include]
"../okf-template" = "t0/_data/okf-template"

[tool.pytest.ini_options]
testpaths = ["tests"]
