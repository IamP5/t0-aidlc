<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metodologia t0</title>
<style>
:root {
  --bg: #ffffff; --bg-soft: #f7f5f5; --panel: #ffffff; --line: #e6e1e1;
  --text: #1a1a1a; --muted: #5f5f5f; --accent: #cc092f; --accent-strong: #9b0020;
  --accent-soft: #fbe9ec; --code-bg: #f4f1f1; --link: #b0082a;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --bg-soft: #1c1c1f; --panel: #17171a; --line: #2c2c31;
    --text: #f2f2f2; --muted: #a8a8ae; --accent: #ff3355; --accent-strong: #ff6b84;
    --accent-soft: #2a1519; --code-bg: #1f1f23; --link: #ff6b84;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --bg-soft: #1c1c1f; --panel: #17171a; --line: #2c2c31;
  --text: #f2f2f2; --muted: #a8a8ae; --accent: #ff3355; --accent-strong: #ff6b84;
  --accent-soft: #2a1519; --code-bg: #1f1f23; --link: #ff6b84;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--accent-strong); }

header.top {
  position: sticky; top: 0; z-index: 20; height: 60px;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; color: var(--text); text-decoration: none; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #cc092f, #e1173f); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.top .spacer { flex: 1; }
.search { position: relative; width: min(340px, 40vw); }
.search input {
  width: 100%; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg-soft); color: var(--text); font: inherit; font-size: 14px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.results {
  position: absolute; top: 42px; left: 0; right: 0; max-height: 60vh; overflow: auto; display: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.15);
}
.results.open { display: block; }
.results a { display: block; padding: 10px 12px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line); font-size: 14px; }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a.active { background: var(--accent-soft); }
.results small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.results mark { background: transparent; color: var(--accent); font-weight: 700; }
.btn {
  height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); color: #fff; }
#menu { display: none; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr) 230px; max-width: 1400px; margin: 0 auto; }
nav.side {
  position: sticky; top: 60px; height: calc(100vh - 60px); overflow: auto; padding: 24px 12px 40px 16px;
  border-right: 1px solid var(--line);
}
nav.side .label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 10px 8px; font-weight: 600; }
nav.side a {
  display: block; padding: 7px 10px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 14.5px; line-height: 1.35;
}
nav.side a:hover { background: var(--bg-soft); }
nav.side a.current { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
nav.side a .num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 12.5px; }

main { padding: 36px clamp(16px, 4vw, 56px) 80px; min-width: 0; }
article { max-width: 780px; }
article h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 20px; }
article h2 { font-size: 24px; line-height: 1.25; letter-spacing: -.01em; margin: 44px 0 12px; padding-top: 12px; border-top: 1px solid var(--line); }
article h3 { font-size: 18.5px; margin: 30px 0 8px; }
article h4 { font-size: 16px; margin: 24px 0 6px; }
article h2 .anchor, article h3 .anchor { opacity: 0; margin-left: 8px; text-decoration: none; color: var(--muted); font-weight: 400; }
article h2:hover .anchor, article h3:hover .anchor { opacity: 1; }
article p, article li { color: var(--text); }
article ul, article ol { padding-left: 1.4em; }
article li { margin: 4px 0; }
article blockquote { margin: 18px 0; padding: 10px 16px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
article blockquote p { margin: 6px 0; }
article code { font: 0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: 2px 5px; border-radius: 5px; }
article pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow: auto; line-height: 1.5; }
article pre code { background: none; padding: 0; font-size: 13.5px; }
.table-wrap { overflow-x: auto; margin: 18px 0; border: 1px solid var(--line); border-radius: 10px; }
article table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
article th, article td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
article th { background: var(--bg-soft); font-weight: 600; white-space: nowrap; }
article tr:last-child td { border-bottom: 0; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
article img { max-width: 100%; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; max-width: 780px; }
.pager a { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; text-decoration: none; color: var(--text); }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; color: var(--muted); font-size: 12.5px; }
.pager .next { text-align: right; }

aside.toc { position: sticky; top: 60px; height: calc(100vh - 60px); overflow: auto; padding: 36px 16px 40px 8px; font-size: 13.5px; }
aside.toc .label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
aside.toc a { display: block; padding: 4px 0 4px 10px; color: var(--muted); text-decoration: none; border-left: 2px solid var(--line); line-height: 1.35; }
aside.toc a.l3 { padding-left: 22px; font-size: 13px; }
aside.toc a:hover { color: var(--text); }
aside.toc a.active { color: var(--accent-strong); border-left-color: var(--accent); }

.empty { color: var(--muted); }

@media (max-width: 1180px) { .layout { grid-template-columns: 250px minmax(0, 1fr); } aside.toc { display: none; } }
@media (max-width: 820px) {
  #menu { display: inline-flex; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.side {
    position: fixed; top: 60px; left: 0; bottom: 0; width: min(300px, 85vw); height: auto; z-index: 15;
    background: var(--bg); transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.2);
  }
  body.nav-open nav.side { transform: none; }
  .search { width: auto; flex: 1 1 auto; min-width: 0; }
  header.top { gap: 8px; padding: 0 12px; }
  .top .spacer { display: none; }
  .btn { padding: 0 10px; }
  .brand span.full, .btn .lbl { display: none; }
  main { padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { nav.side { transition: none; } html { scroll-behavior: auto; } }
@media print {
  header.top, nav.side, aside.toc, .pager { display: none !important; }
  .layout { display: block; } main { padding: 0; }
}
</style>
<script>
(function () {
  try { var t = localStorage.getItem("t0-docs-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
})();
</script>
</head>
<body>
<header class="top">
  <button class="btn" id="menu" aria-label="Abrir navegação">☰</button>
  <a class="brand" href="#/README"><span class="brand-mark">t0</span><span class="full">Metodologia t0</span></a>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar na documentação" aria-label="Buscar" autocomplete="off">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <a class="btn primary" href="apresentacao/index.html" title="Abrir a apresentação"><span>▶</span><span class="lbl">Apresentação</span></a>
  <button class="btn" id="theme" aria-label="Alternar tema claro e escuro" title="Tema claro ou escuro">◐</button>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Páginas"></nav>
  <main>
    <article id="doc"><p class="empty">Carregando…</p></article>
    <div class="pager" id="pager"></div>
  </main>
  <aside class="toc" id="toc" aria-label="Nesta página"></aside>
</div>
<script src="assets/marked.min.js"></script>
<script src="assets/content.js"></script>
<script>
(function () {
  var pages = window.T0_DOCS || [];
  var byId = {}; pages.forEach(function (p) { byId[p.id] = p; });
  var docEl = document.getElementById("doc"), side = document.getElementById("side");
  var tocEl = document.getElementById("toc"), pager = document.getElementById("pager");

  function slug(s) {
    return s.toLowerCase().normalize("NFC").replace(/<[^>]+>/g, "")
      .replace(/[^\p{L}\p{N}\s-]/gu, "").trim().replace(/\s+/g, "-");
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plain(md) { return md.replace(/```[\s\S]*?```/g, " ").replace(/[#>*_`|\[\]()-]/g, " ").replace(/\s+/g, " "); }

  // Sidebar
  var label = document.createElement("div"); label.className = "label"; label.textContent = "Documentação";
  side.appendChild(label);
  pages.forEach(function (p) {
    var a = document.createElement("a"); a.href = "#/" + p.id; a.dataset.id = p.id;
    var m = p.id.match(/^(\d+)-/);
    a.innerHTML = (m ? '<span class="num">' + m[1] + "</span>" : "") + esc(p.title);
    side.appendChild(a);
  });

  marked.use({ gfm: true, breaks: false });

  function rewriteLinks(root, currentId) {
    root.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (href.indexOf("#/") === 0) return;
      if (/^(https?:|mailto:)/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.charAt(0) === "#") { a.setAttribute("href", "#/" + currentId + "/" + href.slice(1)); return; }
      var m = href.match(/^(?:\.\/)?([^\/#?]+)\.md(?:#(.*))?$/);
      if (m && byId[m[1]]) { a.setAttribute("href", "#/" + m[1] + (m[2] ? "/" + m[2] : "")); return; }
      if (/\.md(#.*)?$/.test(href) || href.indexOf("../") === 0) {
        var span = document.createElement("code"); span.textContent = a.textContent; a.replaceWith(span);
      }
    });
  }

  function render(id, anchor) {
    var p = byId[id] || byId["README"] || pages[0];
    if (!p) { docEl.innerHTML = '<p class="empty">Nenhuma página encontrada. Rode <code>python3 docs/build.py</code>.</p>'; return; }
    docEl.innerHTML = marked.parse(p.md);
    docEl.querySelectorAll("table").forEach(function (t) {
      var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    var seen = {}, toc = [];
    docEl.querySelectorAll("h1, h2, h3, h4").forEach(function (h) {
      var base = slug(h.textContent), n = seen[base] || 0; seen[base] = n + 1;
      var s = n ? base + "-" + n : base;
      h.id = s;
      if (h.tagName === "H2" || h.tagName === "H3") {
        var a = document.createElement("a"); a.className = "anchor"; a.href = "#/" + p.id + "/" + s; a.textContent = "#"; a.setAttribute("aria-label", "Link para esta seção");
        h.appendChild(a); toc.push({ id: s, text: h.firstChild.textContent, level: h.tagName === "H2" ? 2 : 3 });
      }
    });
    rewriteLinks(docEl, p.id);
    document.title = p.title + " · Metodologia t0";

    side.querySelectorAll("a").forEach(function (a) { a.classList.toggle("current", a.dataset.id === p.id); });
    tocEl.innerHTML = toc.length ? '<div class="label">Nesta página</div>' + toc.map(function (t) {
      return '<a class="l' + t.level + '" href="#/' + p.id + "/" + t.id + '" data-target="' + t.id + '">' + esc(t.text) + "</a>";
    }).join("") : "";

    var i = pages.indexOf(p), prev = pages[i - 1], next = pages[i + 1];
    pager.innerHTML = (prev ? '<a class="prev" href="#/' + prev.id + '"><small>Anterior</small>' + esc(prev.title) + "</a>" : "<span></span>") +
                      (next ? '<a class="next" href="#/' + next.id + '"><small>Próxima</small>' + esc(next.title) + "</a>" : "");
    document.body.classList.remove("nav-open");
    if (anchor) { var target = document.getElementById(decodeURIComponent(anchor)); if (target) { target.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }

  function route() {
    var h = location.hash.replace(/^#\/?/, ""), parts = h.split("/");
    render(parts[0] || "README", parts.slice(1).join("/"));
  }
  window.addEventListener("hashchange", route);
  route();

  // TOC highlight
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      ticking = false; var links = tocEl.querySelectorAll("a"), cur = null;
      links.forEach(function (a) { var t = document.getElementById(a.dataset.target); if (t && t.getBoundingClientRect().top < 120) cur = a; });
      links.forEach(function (a) { a.classList.toggle("active", a === cur); });
    });
  }, { passive: true });

  // Search
  var q = document.getElementById("q"), results = document.getElementById("results"), sel = -1;
  var index = pages.map(function (p) { return { p: p, text: plain(p.md) }; });
  function search() {
    var term = q.value.trim().toLowerCase(); sel = -1;
    if (term.length < 2) { results.classList.remove("open"); results.innerHTML = ""; return; }
    var hits = [];
    index.forEach(function (e) {
      var low = e.text.toLowerCase(), at = low.indexOf(term);
      if (at < 0 && e.p.title.toLowerCase().indexOf(term) < 0) return;
      var count = low.split(term).length - 1, start = Math.max(0, at - 50);
      var snip = at >= 0 ? (start ? "…" : "") + e.text.substr(start, 140) + "…" : "";
      var re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      hits.push({ p: e.p, score: count + (e.p.title.toLowerCase().indexOf(term) >= 0 ? 50 : 0), snip: esc(snip).replace(re, "<mark>$1</mark>") });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    results.innerHTML = hits.length ? hits.slice(0, 12).map(function (h) {
      return '<a href="#/' + h.p.id + '">' + esc(h.p.title) + "<small>" + h.snip + "</small></a>";
    }).join("") : '<a><small>Nada encontrado.</small></a>';
    results.classList.add("open");
  }
  q.addEventListener("input", search);
  q.addEventListener("keydown", function (ev) {
    var items = results.querySelectorAll("a[href]");
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault(); if (!items.length) return;
      sel = (sel + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach(function (a, i) { a.classList.toggle("active", i === sel); });
    } else if (ev.key === "Enter" && items.length) { location.hash = items[Math.max(sel, 0)].getAttribute("href"); results.classList.remove("open"); q.blur(); }
    else if (ev.key === "Escape") { results.classList.remove("open"); q.blur(); }
  });
  results.addEventListener("click", function () { results.classList.remove("open"); q.value = ""; });
  document.addEventListener("click", function (ev) { if (!ev.target.closest(".search")) results.classList.remove("open"); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== q) { ev.preventDefault(); q.focus(); }
  });

  // Theme + mobile nav
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var nextT = cur === "dark" ? "light" : "dark"; root.setAttribute("data-theme", nextT);
    try { localStorage.setItem("t0-docs-theme", nextT); } catch (e) {}
  });
  document.getElementById("menu").addEventListener("click", function () { document.body.classList.toggle("nav-open"); });
})();
</script>
</body>
</html>
