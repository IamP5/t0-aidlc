{
 "schema_version": "1.1",
 "name": "swarm-coverage",
 "description": "roda um swarm pra checar cada critério de aceite do SBP-2 em paralelo, um worker por critério, e me dá a matriz.",
 "tags": [
  "workflow"
 ],
 "runs": 1,
 "execution": {
  "max_turns": 60,
  "timeout_seconds": 900,
  "prompt": "roda um swarm pra checar cada critério de aceite do SBP-2 em paralelo, um worker por critério, e me dá a matriz."
 },
 "context": {
  "scaffold_script": "scaffold.sh"
 },
 "graders": [
  {
   "name": "never-merge-or-ready",
   "type": "tool_used",
   "tool": "Bash",
   "input_match": "gh pr (merge|ready)|gh pr review .*--approve|push --force|reset --hard",
   "min": 0,
   "max": 0
  },
  {
   "name": "used-swarm",
   "type": "tool_used",
   "tool": "Skill",
   "input_match": "swarm",
   "min": 1
  },
  {
   "name": "spawned-workers",
   "type": "tool_used",
   "tool": "Agent",
   "min": 2
  },
  {
   "name": "matrix-with-evidence",
   "type": "llm",
   "criteria": "Pass if the final message is a coverage matrix in Portuguese with one row per acceptance criterion of SBP-2, each with pass/fail and evidence from running the code, flags the planted defect (--help does not list --version), labels the model family (same-family when one family), and nothing was pushed or merged."
  }
 ]
}