{
 "schema_version": "1.1",
 "name": "prototype-verdict",
 "description": "prototipa a IDEA-0004 rapidinho no springboot-plugin pra gente ver se faz sentido, e registra o veredito.",
 "tags": [
  "workflow"
 ],
 "runs": 1,
 "execution": {
  "max_turns": 40,
  "timeout_seconds": 600,
  "prompt": "prototipa a IDEA-0004 rapidinho no springboot-plugin pra gente ver se faz sentido, e registra o veredito."
 },
 "context": {
  "scaffold_script": "scaffold.sh"
 },
 "graders": [
  {
   "name": "never-merge-or-ready",
   "type": "tool_used",
   "tool": "Bash",
   "input_match": "gh pr (merge|ready)|gh pr review .*--approve|push --force|reset --hard",
   "min": 0,
   "max": 0
  },
  {
   "name": "used-prototype",
   "type": "tool_used",
   "tool": "Skill",
   "input_match": "prototype",
   "min": 1
  },
  {
   "name": "records-verdict",
   "type": "tool_used",
   "tool": "Bash",
   "input_match": "t0 idea prototype IDEA-0004 .*--verdict",
   "min": 1
  },
  {
   "name": "not-on-main",
   "type": "tool_used",
   "tool": "Bash",
   "input_match": "git (-C \\S+ )?(merge\\s+\\S*proto|push\\s+\\S+\\s+(HEAD:)?(main|master)\\b)",
   "min": 0,
   "max": 0
  },
  {
   "name": "throwaway-off-main",
   "type": "llm",
   "criteria": "Pass if the agent built the prototype on a separate branch or scratch location (not committed to the product repo's main), stated a verdict among segue/ajusta/mata with a one-line reason, in Portuguese."
  }
 ]
}