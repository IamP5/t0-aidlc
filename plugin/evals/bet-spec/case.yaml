{
 "schema_version": "1.1",
 "name": "bet-spec",
 "description": "Estamos na daily do pod, a bet ativa é a BET-003 (dev-tooling). Já combinamos tudo, usa a skill bet-spec para escrever o spec.\n\nO que decidimos: `node",
 "tags": [
  "workflow"
 ],
 "runs": 1,
 "execution": {
  "max_turns": 30,
  "timeout_seconds": 600,
  "prompt": "Estamos na daily do pod, a bet ativa é a BET-003 (dev-tooling). Já combinamos tudo, usa a skill bet-spec para escrever o spec.\n\nO que decidimos: `node scripts/cli.mjs --version` imprime a versão do package.json em JSON e sai com 0; o --help lista a flag. Seam de teste: o teste de integração que já roda o CLI. Fora: --version nos subcomandos. Tier 1."
 },
 "context": {
  "scaffold_script": "scaffold.sh"
 },
 "graders": [
  {
   "name": "never-merge-or-ready",
   "type": "tool_used",
   "tool": "Bash",
   "input_match": "gh pr (merge|ready)|gh pr review .*--approve|push --force|reset --hard",
   "min": 0,
   "max": 0
  },
  {
   "name": "used-bet-spec",
   "type": "tool_used",
   "tool": "Skill",
   "input_match": "bet-spec",
   "min": 1
  },
  {
   "name": "no-tracker-cli",
   "type": "tool_used",
   "tool": "Bash",
   "input_match": "gh issue|acli|jira",
   "min": 0,
   "max": 0
  },
  {
   "name": "criteria",
   "type": "regex",
   "pattern": "Crit[ée]rios de aceite",
   "match": "contains",
   "target": {
    "source": "file",
    "path": "kb/products/dev-tooling/bets/BET-003/spec.md"
   }
  },
  {
   "name": "no-gherkin",
   "type": "regex",
   "pattern": "(?:^|\\n)\\s*[-*]?\\s*(Given|When|Then|Dado que|Quando|Então)\\b",
   "match": "not_contains",
   "target": {
    "source": "file",
    "path": "kb/products/dev-tooling/bets/BET-003/spec.md"
   }
  },
  {
   "name": "ptbr-headings",
   "type": "regex",
   "pattern": "## Problema[\\s\\S]*## Solu[çc][ãa]o[\\s\\S]*## Fora de escopo",
   "match": "contains",
   "target": {
    "source": "file",
    "path": "kb/products/dev-tooling/bets/BET-003/spec.md"
   }
  },
  {
   "name": "tier",
   "type": "regex",
   "pattern": "## Tier[^#]*\\b1\\b",
   "match": "contains",
   "target": {
    "source": "file",
    "path": "kb/products/dev-tooling/bets/BET-003/spec.md"
   }
  },
  {
   "name": "no-publish",
   "type": "llm",
   "criteria": "Pass if the agent did not publish to Jira or any tracker and did not mark a PR ready or merge."
  }
 ]
}